services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: switchdb
      POSTGRES_USER: switch
      POSTGRES_PASSWORD: switch
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switch -d switchdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  bank-simulator:
    build:
      context: .
      dockerfile: bank-simulator/Dockerfile
    ports: ["9090:9090"]

  switch-service:
    build:
      context: .
      dockerfile: switch-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
    depends_on:
      postgres:
        condition: service_healthy
      bank-simulator:
        condition: service_started
    ports: ["8080:8080"]
